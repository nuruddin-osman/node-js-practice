<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .upload-form {
        background: #fff;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        width: 350px;
      }
      .upload-form h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }
      .upload-form input[type="file"] {
        width: 100%;
        margin-bottom: 15px;
      }
      .upload-form button {
        width: 100%;
        padding: 10px;
        border: none;
        background: #4caf50;
        color: #fff;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }
      .upload-form button:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <form
      class="upload-form"
      action="/register"
      method="post"
      enctype="multipart/form-data"
    >
      <h2>Upload File</h2>
      <input type="file" name="myfile" required />
      <button type="submit">Upload</button>
    </form>
  </body>
</html>
